name: MCP Live Smoke

# Anonymous strict-client walk of a live MCP surface — the regression net for
# #4937/#4938, two outages that were structurally invisible to unit tests:
#   #4937 — an advertised-but-gated method (prompts/list) hung strict SDK
#           clients (Claude Desktop via mcp-remote) and got the server marked
#           unstable. Unit tests only exercised the method with credentials.
#   #4938 — the Cloudflare apex→www 301 excluded /mcp but not /oauth/*, so
#           OAuth dynamic client registration died (POST→GET on redirect →
#           405). No in-process test can see a CDN redirect rule.
#
# The script still defaults to upstream apex + www (worldmonitor.app). This
# fork does not deploy those hosts, so the workflow does not call the script
# unless a dispatcher passes mcp_smoke_hosts.
#
# The script (scripts/mcp-live-smoke.mjs) initializes anonymously, walks every
# capability the handshake advertises (200 + id echo required on each hop),
# asserts the tools/call auth wall answers 401 fast, and probes the declared
# OAuth endpoints for the #4938 redirect fingerprints with side-effect-free
# malformed POSTs. Dependency-free — no npm ci.
#
# Triggers:
#   - workflow_dispatch: manual runs. mcp_smoke_hosts is required. The script
#     default (https://worldmonitor.app,https://www.worldmonitor.app) is the
#     upstream project's production. Scheduled runs against that default
#     returned 401/410 and were removed.
# NOT schedule: the 6-hour cron (`23 */6 * * *`) only ever probed upstream
# production. Re-enable it only for a host this fork actually serves, and
# pass that host explicitly.
# NOT push / pull_request: a push of this file would otherwise run the script
# against its upstream default and fail for a host this fork does not deploy.
# The target is a live deployment, not PR code.

on:
  workflow_dispatch:
    inputs:
      mcp_smoke_hosts:
        description: 'Comma-separated MCP base URLs to probe. Required — the script default is upstream worldmonitor.app, which this fork does not deploy.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    # ~40 requests × 15s worst-case timeout each ≈ 10min absolute ceiling;
    # nominal runs finish in well under a minute.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Probe MCP hosts
        env:
          MCP_SMOKE_HOSTS: ${{ inputs.mcp_smoke_hosts }}
          # This fork does not deploy the script's upstream variant hosts.
          MCP_SMOKE_VARIANT_HOSTS: ''
          # Fork metadata advertises upstream OAuth endpoints; probe the same
          # paths on the dispatched host so the run never contacts upstream.
          MCP_SMOKE_OAUTH_SAME_ORIGIN: '1'
        run: |
          if [ -z "$MCP_SMOKE_HOSTS" ]; then
            echo "::error::mcp_smoke_hosts is required. The script default is upstream worldmonitor.app, which this fork does not deploy."
            exit 1
          fi
          node scripts/mcp-live-smoke.mjs
